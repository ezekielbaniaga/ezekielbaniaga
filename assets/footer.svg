<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 214" width="900" height="214" role="img" aria-labelledby="t d">
  <title id="t">Signing off</title>
  <desc id="d">A btop-style dashboard while zek-debian the robot sleeps: energy drains, dreams fill, the cpu is idle. The prompt says back on the next shift.</desc>
  <defs>
    <style>text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }</style>
    <linearGradient id="meter" gradientUnits="userSpaceOnUse" x1="276" y1="0" x2="426" y2="0">
      <stop offset="0" stop-color="#3fb950"/><stop offset="0.6" stop-color="#d29922"/><stop offset="1" stop-color="#f85149"/>
    </linearGradient>
    <pattern id="vgap" width="6" height="10" patternUnits="userSpaceOnUse" x="276">
      <rect width="6" height="10" fill="#fff"/><rect x="5" width="1" height="10" fill="#000"/>
    </pattern>
    <mask id="cellmask" maskUnits="userSpaceOnUse" x="276" y="0" width="150" height="214">
      <rect x="276" y="0" width="150" height="214" fill="url(#vgap)"/>
    </mask>
    <linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="0" y1="152" x2="0" y2="80">
      <stop offset="0" stop-color="#3fb950"/><stop offset="0.55" stop-color="#d29922"/><stop offset="1" stop-color="#f85149"/>
    </linearGradient>
    <pattern id="hgap" width="6" height="6" patternUnits="userSpaceOnUse" y="152">
      <rect width="6" height="6" fill="#fff"/><rect y="5" width="6" height="1" fill="#000"/>
    </pattern>
    <mask id="gcells" maskUnits="userSpaceOnUse" x="550" y="80" width="300" height="72">
      <rect x="550" y="80" width="300" height="72" fill="url(#hgap)"/>
    </mask>
    <clipPath id="gclip"><rect x="550" y="80" width="300" height="72"/></clipPath>
    <clipPath id="say"><rect x="176" y="170" width="0" height="26">
      <animate attributeName="width" values="0;0;232;232;0" keyTimes="0;0.08;0.5;0.94;1" dur="10s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="900" height="214" rx="10" fill="#0d1117"/>
  <text x="24" y="32" font-size="14" xml:space="preserve"><tspan fill="#3fb950">zek@zek-debian</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#6e7681">$ </tspan><tspan fill="#c9d1d9">btop --sleep</tspan></text>

